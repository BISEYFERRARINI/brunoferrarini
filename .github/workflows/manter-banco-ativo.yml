# Mantém o banco de dados (Supabase, plano grátis) ativo.
# O plano grátis pausa o projeto depois de 7 dias sem uso; este robô
# faz uma consulta leve a cada 2 dias para isso não acontecer.
name: Manter banco ativo

on:
  schedule:
    - cron: "17 13 */2 * *"   # a cada 2 dias, ~9h da manhã (horário de Boston)
  workflow_dispatch: {}        # permite rodar na mão pela aba Actions

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Consulta leve no banco
        env:
          URL: https://zvjirpqmyjhawtteainq.supabase.co
          # chave pública "anon" (a mesma que está no app; não dá acesso a dados)
          KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inp2amlycHFteWpoYXd0dGVhaW5xIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI1NDAzNTYsImV4cCI6MjEwODExNjM1Nn0.SN8nci_MAk9EEYJT7UEWOkEROQkjqGamizl7kbrhJAA
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" -X POST "$URL/rest/v1/rpc/needs_setup" \
            -H "apikey: $KEY" -H "Authorization: Bearer $KEY" -H "Content-Type: application/json" -d '{}')
          echo "Resposta do banco: $code"
          test "$code" = "200"
