<script>
  /* migração única do nome antigo (antes chamado Nivela): copia chaves nivela_* / nivela-* do localStorage e do sessionStorage para bisey_* / bisey-* (sem sobrescrever) e apaga as antigas */
  (function () { var O = "nivela", N = "bisey"; ["localStorage", "sessionStorage"].forEach(function (n) { try { var s = window[n], ks = [], i, k; for (i = 0; i < s.length; i++) { k = s.key(i); if (k && k.indexOf(O) === 0 && /[_-]/.test(k.charAt(O.length))) ks.push(k); } ks.forEach(function (k) { try { var nk = N + k.slice(O.length), v = s.getItem(k); if (v !== null && s.getItem(nk) === null) s.setItem(nk, v.split(O + "_demo_org_").join(N + "_demo_org_")); s.removeItem(k); } catch (e) {} }); } catch (e) {} }); })();

  /* tema salvo (claro/escuro/automático) aplicado antes de pintar, para não piscar */
  (function () { try { var t = localStorage.getItem("bisey_theme"); if (t === "dark" || t === "light") document.documentElement.setAttribute("data-theme", t); } catch (e) {} })();
</script>
